<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      height: 100vh;
    }
    #signal{
      height:630px;
      width:250px;
      background:black;
      border-radius:30px;
      margin-left:43%;
      margin-top:20px;
      padding-top:40px; 
      line-height: 200px;
    }
    #red{
    height: 180px;
    width: 180px;
    background:red;
    border:3px solid white;
    border-radius:50%;
    margin-left:30px;
    padding-top:50px;
    text-align: center;
    color:white;
    font-weight:bold;
    line-height:28px;
  }
  #yellow{
    height: 180px;
    width: 180px;
    background:orange;
    border:3px solid white;
    border-radius:50%;
    margin-left:30px;
    margin-top:15px;
    padding-top:60px;
    text-align:center;
    color:white;
    font-weight:bold;
    line-height:28px;
  }
  #green{
    height:180px;
    width:180px;
    background:green;
    border:3px solid white;
    border-radius:50%;
    margin-left:30px;
    margin-top:15px;
    padding-top:60px;
    text-align:center;
    color:white;
    font-weight:bold;
    line-height:28px;
  }
  #pole{
    height:150px;
    width:22px;
    background:black;
    margin-left:52%;
  }
  h1{
    text-align: center;
    margin-left: 100px;
    font-size:34px;
  }
  p{
    text-align: center;
    margin-left: 100px;
  }
  </style>
</head>
<body>
  <div id="signal">
    <div id="red">
        STOP <br>
        PROCRASTINATION <br>✋
    </div>
    <div id="yellow">GET READY TO<br> LEARN 📚
    </div>

    <div id="green">START YOUR TECH<br> JOURNEY 🚀
    </div>
  </div>
  <div id="pole"></div>
  <h1>FULLSTACK EXPERTS ACADEMY</h1>
  <p>Learn • Build • Grow 💡</p>
</body>
</html>
